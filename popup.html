<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <h1>GrabMaster</h1>
      <span id="state" class="state">Off</span>
    </header>

    <form>
      <div class="section">
        <p class="section-title">Time controls</p>
        <div id="timeControls">
          <details>
            <summary>Bullet</summary>
            <div class="option">
              <label for="tc-1+0">1 min</label>
              <input type="checkbox" id="tc-1+0" value="1+0">
            </div>
            <div class="option">
              <label for="tc-1+1">1+1</label>
              <input type="checkbox" id="tc-1+1" value="1+1">
            </div>
            <div class="option">
              <label for="tc-1+2">1+2</label>
              <input type="checkbox" id="tc-1+2" value="1+2">
            </div>
            <div class="option">
              <label for="tc-2+0">2 min</label>
              <input type="checkbox" id="tc-2+0" value="2+0">
            </div>
            <div class="option">
              <label for="tc-2+1">2+1</label>
              <input type="checkbox" id="tc-2+1" value="2+1">
            </div>
          </details>
          <details>
            <summary>Blitz</summary>
            <div class="option">
              <label for="tc-3+0">3 min</label>
              <input type="checkbox" id="tc-3+0" value="3+0">
            </div>
            <div class="option">
              <label for="tc-3+1">3+1</label>
              <input type="checkbox" id="tc-3+1" value="3+1">
            </div>
            <div class="option">
              <label for="tc-3+2">3+2</label>
              <input type="checkbox" id="tc-3+2" value="3+2">
            </div>
            <div class="option">
              <label for="tc-3+3">3+3</label>
              <input type="checkbox" id="tc-3+3" value="3+3">
            </div>
            <div class="option">
              <label for="tc-5+0">5 min</label>
              <input type="checkbox" id="tc-5+0" value="5+0">
            </div>
            <div class="option">
              <label for="tc-5+3">5+3</label>
              <input type="checkbox" id="tc-5+3" value="5+3">
            </div>
            <div class="option">
              <label for="tc-10+0">10 min</label>
              <input type="checkbox" id="tc-10+0" value="10+0">
            </div>
          </details>
          <details>
            <summary>Rapid</summary>
            <div class="option">
              <label for="tc-10+10">10+10</label>
              <input type="checkbox" id="tc-10+10" value="10+10">
            </div>
            <div class="option">
              <label for="tc-15+0">15 min</label>
              <input type="checkbox" id="tc-15+0" value="15+0">
            </div>
            <div class="option">
              <label for="tc-15+10">15+10</label>
              <input type="checkbox" id="tc-15+10" value="15+10">
            </div>
            <div class="option">
              <label for="tc-25+0">25 min</label>
              <input type="checkbox" id="tc-25+0" value="25+0">
            </div>
            <div class="option">
              <label for="tc-25+10">25+10</label>
              <input type="checkbox" id="tc-25+10" value="25+10">
            </div>
            <div class="option">
              <label for="tc-45+0">45 min</label>
              <input type="checkbox" id="tc-45+0" value="45+0">
            </div>
            <div class="option">
              <label for="tc-45+10">45+10</label>
              <input type="checkbox" id="tc-45+10" value="45+10">
            </div>
          </details>
          <details>
            <summary>Classic</summary>
            <div class="option">
              <label for="tc-60+0">1 hour</label>
              <input type="checkbox" id="tc-60+0" value="60+0">
            </div>
            <div class="option">
              <label for="tc-90+0">1 h 30 min</label>
              <input type="checkbox" id="tc-90+0" value="90+0">
            </div>
            <div class="option">
              <label for="tc-120+0">2 hours</label>
              <input type="checkbox" id="tc-120+0" value="120+0">
            </div>
          </details>
        </div>
      </div>
      
      <div class="section">
        <p class="section-title">Game type</p>
        <div class="option">
          <label for="any">Any</label>
          <input type="radio" name="gameType" id="any" value="any">
        </div>
        <div class="option">
          <label for="rated">Rated</label>
          <input type="radio" name="gameType" id="rated" value="rated">
        </div>
        <div class="option">
          <label for="casual">Casual</label>
          <input type="radio" name="gameType" id="casual" value="casual">
        </div>
      </div>

      <div class="section">
        <p class="section-title">Opponent rating</p>
        <div class="option">
          <label for="minRating">Min rating</label>
          <input type="number" id="minRating" min="0" max="3500" step="50">
        </div>
        <div class="option">
          <label for="maxRating">Max rating</label>
          <input type="number" id="maxRating" min="0" max="3500" step="50">
        </div>
        <div class="option">
          <label for="acceptUnrated">Also accept unrated players</label>
          <input type="checkbox" id="acceptUnrated">
        </div>
      </div>

      <button id="go" type="button">Start accepting</button>
    </form>
  </body>
</html>
