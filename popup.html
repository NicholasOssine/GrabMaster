<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <header>
      <h1>GrabMaster</h1>
    </header>

    <form>
      <div class="section">
        <p class="section-title">Time controls</p>
        <div id="categories">
          <div class="option">
            <label for="bullet">Bullet</label>
            <input type="checkbox" id="bullet" value="Bullet">
          </div>
          <div class="option">
            <label for="blitz">Blitz</label>
            <input type="checkbox" id="blitz" value="Blitz">
          </div>
          <div class="option">
            <label for="rapid">Rapid</label>
            <input type="checkbox" id="rapid" value="Rapid">
          </div>
          <div class="option">
            <label for="classic">Classic</label>
            <input type="checkbox" id="classic" value="Classic">
          </div>
          <div class="option">
            <label for="daily">Daily</label>
            <input type="checkbox" id="daily" value="Daily">
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
